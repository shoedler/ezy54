meta:
  engine: 4.2.1

# =====================================================================
#  ezy54 - 54 key column staggered wireless split, Choc v1/v2, 18x17mm
#
#  Everything that has a physical meaning lives in `units` below. The
#  markup only ever refers to units, so changing a number here
#  propagates to the PCB, the switchplate (incl. the MCU/battery
#  housing), the bottom case and the carry case at once.
# =====================================================================

units:
  # ------------------------------------------------------------------
  #  PCB / fabrication
  # ------------------------------------------------------------------
  pcb_t: 1.6 # 2 layer JLCPCB default
  pcb_edge_pad: 1.5 # Copper-free margin the outline adds around a key
  pcb_origin_x: 150 # Keeps KiCad coordinates positive
  pcb_origin_y: -150
  pcb_screw_hole_size: 4.6 # NPTH annulus for the M2 clearance hole
  pcb_screw_drill: 2.2
  pcb_switch_pad_w: 2 # Outer hotswap pad width
  # Diode placement relative to its switch.
  #
  # The x offset is not actually required: the original [0, 3.5] passes
  # `python tools/drc_lite.py` too. It was added in response to a phantom
  # collision on the splayed thumb keys, which turned out to be a rotation
  # sign bug in drc_lite (see tools/README.md). It is kept because pcb rev1
  # was fabricated with it - revert to 0 for a future revision if you would
  # rather have the shorter traces. tools/diode_fit.py sweeps the offset
  # against every other pad and the board edge.
  pcb_diode_x_off: -5
  pcb_diode_y_off: 3.5
  pcb_clearance: 0.2 # JLCPCB minimum copper to copper
  pcb_edge_clearance: 0.3 # JLCPCB minimum copper to board edge

  # ------------------------------------------------------------------
  #  Copper pours
  #
  #  A GND pour on both layers, with the MCU footprint cut out of it: the
  #  nice!nano v2 / SuperMini guidance is to keep copper from under the
  #  module so its antenna is not detuned.
  #
  #  Zone polygons are written into the board verbatim, so unlike every
  #  other number here they are *KiCad* coordinates - y points down, the
  #  negation of ergogen's y - and they have to be literals, because
  #  ergogen does not resolve unit names inside nested arrays. They live
  #  next to the footprints in `pcbs:`. They are not derived, so
  #  `python tools/drc_lite.py` asserts that the pour still covers the
  #  board and the keepout still covers the MCU. Re-run it if you move
  #  anything in the MCU column.
  # ------------------------------------------------------------------
  # ------------------------------------------------------------------
  #  Key layout  (verified ergonomics - touch with care)
  #  cx / cy are ergogen's cap units: 18 x 17 mm.
  # ------------------------------------------------------------------
  key_c1_stagger: 2 # Pinky
  key_c2_stagger: 10 # Ring
  key_c2_splay: -2
  key_c3_stagger: 4 # Middle
  key_c4_stagger: -4 # Index
  key_c5_stagger: -5 # Inner
  key_mid_spread: cx + 0.25 # Ring + middle get a hair more spread

  thumb_anchor_x: -0.9 * cx
  thumb_anchor_y: -1.05 * cy
  thumb_spread: 20
  thumb_c3_splay: -10
  thumb_c4_splay: -9
  thumb_c5_splay: -24
  thumb_c4_origin_x: -12
  thumb_c4_origin_y: -9
  thumb_c5_origin_x: -10
  thumb_c5_origin_y: -8

  keycap_gap: 0.5 # Air between neighbouring 1u caps
  keycap_fillet: 1
  keycap_w: cx - keycap_gap
  keycap_d: cy - keycap_gap
  keycap_h: 10.7 # PCB top -> top of switch+cap (measured on shoedler54)

  # ------------------------------------------------------------------
  #  MCU - SuperMini nRF52840 on a removable socket
  #
  #  The male header is soldered in from the top, its plastic removed
  #  and the pins cut flush, so nothing sticks up past the board. The
  #  USB-C shell is therefore the tallest part of the assembly, and it
  #  is let into the MCU's own pcb - its underside is flush with the
  #  underside of the MCU board, i.e. exactly one socket height up.
  # ------------------------------------------------------------------
  mcu_w: 17.78
  mcu_h: 33
  mcu_socket_h: 3.6 # Female pin header the MCU seats on
  mcu_usb_w: 8.94 # USB-C receptacle, across the board
  mcu_usb_d: 7.35 # USB-C receptacle, along the board
  mcu_usb_t: 3.2 # USB-C receptacle height
  mcu_usb_inset: 0.7 # Receptacle overhang past the MCU board edge
  mcu_usb_z: mcu_socket_h # Underside of the receptacle, above the PCB
  mcu_top_h: mcu_usb_z + mcu_usb_t # Tallest point of the assembly
  mcu_north_keepout: mcu_h / 2 + mcu_usb_inset # Board edge, or the USB-C shell
  mcu_col_gap: 0.75 # Keycap edge -> housing outer wall, everywhere
  # The MCU column's north edge may run ahead of the key field's: columns
  # c3/c4 sit further north anyway, so this is free board area. Measured
  # from the key field's north edge to the outside of the north wall.
  mcu_col_north_off: 3.5

  # ------------------------------------------------------------------
  #  Battery - 701535 LiPo, as measured incl. the wire exit
  # ------------------------------------------------------------------
  bat_w: 15
  bat_l: 40
  bat_t: 6.5
  bat_gap: 0.75 # Battery -> housing wall / connector lane / screw boss
  mcu_bat_gap: 1 # MCU keep-out -> battery

  # ------------------------------------------------------------------
  #  Battery connector - JST PH 2.0, S2B-PH-K, top side of the PCB.
  #  It gets its own lane east of the battery so the two can never
  #  fight over the same space (the shoedler54 problem).
  # ------------------------------------------------------------------
  bat_conn_lane_w: 7 # ceoloide courtyard width (2 * 3.45)
  bat_conn_l: 12.35 # ceoloide courtyard length (-1.85 .. 10.5)
  bat_conn_front: 1.85 # Courtyard ahead of the pad row

  # ------------------------------------------------------------------
  #  USB-C access
  #
  #  A bespoke window: exactly the receptacle's cross section plus a
  #  hair, at exactly the height the receptacle ends up at. The north
  #  wall is thinned so there is as little material as possible in
  #  front of the port; a fat cable has to fit on its own merits.
  # ------------------------------------------------------------------
  usb_win_fit: 0.1 # Added to each window dimension
  usb_win_w: mcu_usb_w + usb_win_fit
  usb_win_z0: mcu_usb_z - usb_win_fit / 2 # Window sill, above the PCB
  usb_win_z1: mcu_usb_z + mcu_usb_t + usb_win_fit / 2 # Window head

  # ------------------------------------------------------------------
  #  Screws - M2, heat set inserts in the bottom case
  # ------------------------------------------------------------------
  screw_head_d: 4.1 # Measured 4.0, plus a little buffer
  screw_head_h: 0.9 # Measured a little under 1.0
  screw_head_r: screw_head_d / 2
  case_plate_screw_r: 1.2 # M2 clearance hole
  case_insert_bore_r: 1.65 # M2x3 heat set insert bore
  case_standoff_r: 3.1 # Standoff in the bottom case
  case_insert_lip_h: 1 # Insert bottoms out on this
  case_boss_wall_t: 1 # Material around a head counterbore in the housing
  case_boss_r: screw_head_r + case_boss_wall_t # In-cavity support cylinder

  # ------------------------------------------------------------------
  #  Reset / power switches (SMD side actuated, back of the PCB)
  #  Positioned relative to the north edge of the key field.
  # ------------------------------------------------------------------
  sw_body_h: 1.5 # Body height below the PCB
  sw_reset_x_off: -5 # From matrix_c5_r4
  sw_reset_y_in: 2.3 # Centre below the board's north edge; its mounting
  # bosses reach 1.75mm north of that, so this keeps them off the edge.
  sw_reset_body_w: 4.72 # Courtyard
  sw_reset_body_d: 4.5 # 3.5 body + 1.0 actuator, which points north
  sw_reset_body_dy: 0.5 # ...so the body box is offset from the pad centre
  sw_reset_slot_dx: 0.65 # Actuator offset from the body centre
  sw_reset_slot_w: 3.6
  sw_power_x_off: 5
  sw_power_y_in: 2.2 # Keeps its body pads off the board edge
  sw_power_body_w: 5.85 # Courtyard, incl. the actuator
  sw_power_body_d: 8.8
  sw_power_body_dx: 0.17 # Actuator makes the courtyard asymmetric

  # ------------------------------------------------------------------
  #  Case - bottom shell
  # ------------------------------------------------------------------
  case_bottom_t: 2 # Floor thickness
  case_wall_rise: 2.5 # Floor -> underside of the PCB (standoff height)
  case_wall_expand: 3 # Wall sits this far outside the PCB edge
  case_pcb_fit: 0.7 # Slip fit around the PCB
  case_wall_t: case_wall_expand - case_pcb_fit # ...so the wall is this thick
  case_switchplate_d: 2.2 # Plate thickness (Choc)
  case_switch_hole: 14.2 # 14.0 + 0.2 print allowance
  case_h: case_bottom_t + case_wall_rise + pcb_t + case_switchplate_d
  case_io_lip_h: case_bottom_t + case_wall_rise - sw_body_h
  case_io_mask_overlap: 1 # How far a mask reaches past the wall, either side
  case_io_mask_d: case_wall_t + 2 * case_io_mask_overlap

  # ------------------------------------------------------------------
  #  MCU / battery housing ("shroud")
  #
  #  Part of the switchplate: a box that closes over the MCU, the
  #  battery and the battery connector. Prints plate-side down, so the
  #  cavity needs support but nothing else does. Its south wall follows
  #  the north edges of the two inner thumb keycaps at `mcu_col_gap`,
  #  the same gap the west wall keeps.
  # ------------------------------------------------------------------
  case_shroud_wall_t: 1.5
  case_shroud_n_wall_t: 1 # Thin, to keep material out of the USB plug's way
  case_shroud_roof_t: 1.5
  case_shroud_gap: 0.5 # Component -> inner wall
  # Interior holds the MCU with the screw boss lane beside it, or the
  # battery with the connector lane beside it - whichever is wider.
  case_shroud_inner_w: max(mcu_w + 2 * case_shroud_gap + 2 * case_boss_r, bat_w + 2 * bat_gap + bat_conn_lane_w)
  case_shroud_outer_w: case_shroud_inner_w + 2 * case_shroud_wall_t
  case_shroud_inner_h: max(bat_t, mcu_top_h) + case_shroud_gap
  case_shroud_h: case_shroud_inner_h + case_shroud_roof_t # Above the PCB
  shroud_rise: case_shroud_h - case_switchplate_d # Above the switchplate
  # Raw extent before the thumb keys carve the south wall. Any value
  # past the carve gives the same result; it just has to be generous.
  case_shroud_raw_l: 120
  shroud_cut_size: 80 # Half plane stand-in for the thumb key cuts

  mcu_inset: mcu_north_keepout - mcu_h / 2 + case_shroud_gap + case_shroud_n_wall_t
  # Housing faces, in the MCU's local frame
  shroud_n_off: mcu_h / 2 + mcu_inset
  shroud_w_off: -(mcu_w / 2 + case_shroud_gap + case_shroud_wall_t)
  shroud_e_off: shroud_w_off + case_shroud_outer_w
  shroud_cx_off: shroud_w_off + case_shroud_outer_w / 2
  # ...and where the thumb keycaps push the south wall back to
  shroud_thumb_off: keycap_d / 2 + mcu_col_gap
  shroud_thumb_off_x: keycap_w / 2 + mcu_col_gap
  shroud_thumb_off_in: shroud_thumb_off + case_shroud_wall_t
  shroud_thumb_off_x_in: shroud_thumb_off_x + case_shroud_wall_t

  # Column position: keycap edge -> gap -> housing wall -> gap -> MCU
  mcu_x_off: cx / 2 + mcu_col_gap + case_shroud_wall_t + case_shroud_gap + mcu_w / 2

  # Battery, connector and the two housing screws, in the MCU's frame
  bat_x_off: shroud_w_off + case_shroud_wall_t + bat_gap + bat_w / 2
  bat_y_off: -(mcu_h / 2 + mcu_bat_gap + bat_l / 2)
  bat_conn_x_off: shroud_e_off - case_shroud_wall_t - bat_conn_lane_w / 2
  bat_conn_y_off: -(mcu_h / 2 + mcu_bat_gap + bat_conn_front)
  # NE boss: tucked into the corner, in the lane beside the MCU
  screw_ne_x_off: shroud_e_off - case_shroud_wall_t - case_boss_r
  screw_ne_y_off: shroud_n_off - case_shroud_n_wall_t - case_boss_r
  # S boss: same lane, riding just off the south end of the battery.
  # Further south the housing narrows into the thumb wedge and a boss
  # no longer fits.
  screw_s_y_off: bat_y_off - bat_l / 2 - bat_gap - case_boss_r

  # ------------------------------------------------------------------
  #  Outline shaping
  # ------------------------------------------------------------------
  pcb_north_off: cy / 2 + pcb_edge_pad / 2 # North edge of the key field
  outline_c1c2_fill_w: 10 # Fills the notch the ring stagger opens up
  outline_c1c2_fill_h: 20
  outline_c1c2_fill_x: cx / 2 + 5
  outline_bridge_x: 8 # How far the thumb bridge reaches under c3

  screw_2_shift_y: -2.5
  screw_5_shift_y: -2

  # Reset and power share one opening - no post left standing between
  # them. The power end stops short of the housing's west wall.
  sw_power_slot_margin: 1.5
  sw_reset_slot_e: sw_reset_x_off + sw_reset_slot_dx + sw_reset_slot_w / 2
  sw_power_slot_e: mcu_x_off + shroud_w_off - sw_power_slot_margin
  sw_power_slot_w: sw_power_slot_e - sw_reset_slot_e
  sw_power_slot_x: (sw_power_slot_e + sw_reset_slot_e) / 2

  # ------------------------------------------------------------------
  #  Carry case - a sleeve both halves slot into, caps facing inwards
  # ------------------------------------------------------------------
  keycap_rise: keycap_h - case_switchplate_d # Cap top above the plate
  carry_wall_t: 3
  carry_fit: 1 # Clearance around an assembled half
  carry_lip_w: 2.3 # Retaining lip the halves bottom out on
  carry_pocket_d: case_h + 0.2 # Depth of each end pocket
  # Middle void: two sets of caps facing each other, or one set facing
  # the MCU housing of the other half.
  carry_void_h: max(2 * keycap_rise, shroud_rise + keycap_rise) + 1
  carry_h: 2 * carry_pocket_d + carry_void_h

points:
  key.padding: cy
  key.spread: cx
  key.tags: key
  zones:
    matrix:
      anchor:
        shift: [pcb_origin_x, pcb_origin_y]
      columns:
        c0: # Outer
        c1: # Pinky
          key.stagger: key_c1_stagger
        c2: # Ring
          key.splay: key_c2_splay
          key.spread: key_mid_spread
          key.stagger: key_c2_stagger
        c3: # Middle
          key.spread: key_mid_spread
          key.stagger: key_c3_stagger
        c4: # Index
          key.stagger: key_c4_stagger
        c5: # Inner
          key.stagger: key_c5_stagger
      rows:
        r1: # Bottom
        r2: # Home
        r3: # Above
        r4: # Nums

    thumb:
      anchor:
        ref: matrix_c5_r1
        shift: [thumb_anchor_x, thumb_anchor_y]
      columns:
        c3: # Thumb-outer
          key.splay: thumb_c3_splay
        c4: # Thumb-middle
          key.spread: thumb_spread
          key.splay: thumb_c4_splay
          key.origin: [thumb_c4_origin_x, thumb_c4_origin_y]
        c5: # Thumb-inner
          key.spread: thumb_spread
          key.splay: thumb_c5_splay
          key.origin: [thumb_c5_origin_x, thumb_c5_origin_y]
      rows:
        r0: # Thumb

    mcu:
      key.tags:
        - helper
      anchor:
        - ref: matrix_c5_r4
          # Placed so the *outside* of the housing's north wall lands
          # `mcu_col_north_off` ahead of the key field's north edge.
          shift: [mcu_x_off, pcb_north_off + mcu_col_north_off - shroud_n_off]

    bat:
      key.tags:
        - helper
      anchor:
        - ref: mcu
          shift: [bat_x_off, bat_y_off]

    bat_conn: # JST PH 2.0. Ergogen mirrors footprint-y, so at rotation 0 the
      # connector's mouth and cable already face south, down its own lane.
      key.tags:
        - helper
      anchor:
        - ref: mcu
          shift: [bat_conn_x_off, bat_conn_y_off]

    on_off_switch:
      key.tags:
        - helper
      anchor:
        - ref: matrix_c5_r4
          shift: [sw_power_x_off, pcb_north_off - sw_power_y_in]
          # +90 puts the slider's actuator out at the board's north edge.
          rotate: 90

    reset_switch:
      key.tags:
        - helper
      anchor:
        - ref: matrix_c5_r4
          shift: [sw_reset_x_off, pcb_north_off - sw_reset_y_in]

    screw_1:
      key.tags:
        - helper
        - screw
        - plate_screw
      anchor:
        aggregate.parts:
          - ref: matrix_c0_r4
          - ref: matrix_c0_r3
          - ref: matrix_c1_r4
          - ref: matrix_c1_r3

    screw_2:
      key.tags:
        - helper
        - screw
        - plate_screw
      anchor:
        aggregate.parts:
          - ref: matrix_c5_r4
          - ref: matrix_c5_r3
          - ref: matrix_c4_r4
          - ref: matrix_c4_r3
        shift: [0, screw_2_shift_y]

    screw_3:
      key.tags:
        - helper
        - screw
        - plate_screw
      anchor:
        aggregate.parts:
          - ref: matrix_c0_r1
          - ref: matrix_c0_r2
          - ref: matrix_c1_r1
          - ref: matrix_c1_r2

    screw_5:
      key.tags:
        - helper
        - screw
        - plate_screw
      anchor:
        aggregate.parts:
          - ref: matrix_c4_r2
          - ref: matrix_c4_r1
          - ref: matrix_c3_r2
          - ref: matrix_c3_r1
        shift: [0, screw_5_shift_y]

    # Housing screws: these two run through the roof, down a support
    # cylinder inside the cavity, and clamp it against the PCB.
    screw_4: # South end of the battery bay
      key.tags:
        - helper
        - screw
        - boss_screw
      anchor:
        - ref: mcu
          shift: [screw_ne_x_off, screw_s_y_off]

    screw_6: # North east corner of the housing
      key.tags:
        - helper
        - screw
        - boss_screw
      anchor:
        - ref: mcu
          shift: [screw_ne_x_off, screw_ne_y_off]

outlines:
  # ------------------------------------------- MCU / battery housing
  # Everything the two inner thumb keycaps claim: south of both of
  # their north edges, plus anything east of the inner one's east
  # edge. Subtracting *that* leaves a boundary that follows whichever
  # keycap edge is nearer - which is the effiddy-style angled wall.
  _shroud_thumb_cut:
    - where: [thumb_c4_r0]
      what: rectangle
      size: shroud_cut_size
      adjust.shift: [0, shroud_thumb_off - shroud_cut_size/2]
    - where: [thumb_c5_r0]
      what: rectangle
      size: shroud_cut_size
      adjust.shift: [0, shroud_thumb_off - shroud_cut_size/2]
      operation: intersect
    - where: [thumb_c5_r0]
      what: rectangle
      size: shroud_cut_size
      adjust.shift: [shroud_thumb_off_x + shroud_cut_size/2, 0]

  _shroud_thumb_cut_inner: # Same, one wall thickness further in
    - where: [thumb_c4_r0]
      what: rectangle
      size: shroud_cut_size
      adjust.shift: [0, shroud_thumb_off_in - shroud_cut_size/2]
    - where: [thumb_c5_r0]
      what: rectangle
      size: shroud_cut_size
      adjust.shift: [0, shroud_thumb_off_in - shroud_cut_size/2]
      operation: intersect
    - where: [thumb_c5_r0]
      what: rectangle
      size: shroud_cut_size
      adjust.shift: [shroud_thumb_off_x_in + shroud_cut_size/2, 0]

  _shroud_outer:
    - where: [mcu]
      what: rectangle
      size: [case_shroud_outer_w, case_shroud_raw_l]
      adjust.shift: [shroud_cx_off, shroud_n_off - case_shroud_raw_l/2]
    - what: outline
      name: _shroud_thumb_cut
      operation: subtract

  _shroud_inner: # Cavity
    - where: [mcu]
      what: rectangle
      size: [case_shroud_inner_w, case_shroud_raw_l]
      adjust.shift:
        - shroud_cx_off
        - shroud_n_off - case_shroud_n_wall_t - case_shroud_raw_l/2
    - what: outline
      name: _shroud_thumb_cut_inner
      operation: subtract

  _shroud_usb_window: # Reaches from inside the cavity out through the north wall
    - where: [mcu]
      what: rectangle
      size: [usb_win_w, case_io_mask_d]
      adjust.shift: [0, mcu_h/2 + case_io_mask_d/2]

  _shroud_usb_sill: # Exactly the wall slice, re-added below the window.
    # Must not overhang the wall: anything sticking out past shroud_n_off
    # becomes a little block on the outside of the housing.
    - where: [mcu]
      what: rectangle
      size: [usb_win_w, case_shroud_n_wall_t]
      adjust.shift: [0, shroud_n_off - case_shroud_n_wall_t/2]

  _shroud_bosses: # Support cylinders, PCB -> roof
    - where: [boss_screw]
      what: circle
      radius: case_boss_r

  # --------------------------------------------------------------- PCB
  ezy54: # Main PCB outline.
    - where: [key]
      what: rectangle
      size: [cx+pcb_edge_pad, cy+pcb_edge_pad]
    - what: rectangle # Fixes gap between pinky and ring cols (top)
      where: matrix_c1_r4
      size: [outline_c1c2_fill_w, outline_c1c2_fill_h]
      adjust.shift: [outline_c1c2_fill_x, (cy+pcb_edge_pad)/2 - outline_c1c2_fill_h/2]
    # The MCU column and the thumb bridge. The north edge is pinned to
    # the housing's north corners and the east edge runs from the inner
    # thumb key to the housing's NE corner, so the board always carries
    # the housing footprint.
    - what: polygon
      points:
        - ref: matrix_c2_r1
          shift: [cx/2, -cy/2]
        - ref: matrix_c3_r1
          shift: [-cx/2, -cy/2]
        - ref: matrix_c3_r1
          shift: [outline_bridge_x, -cy/2]
        - ref: thumb_c3_r0
          shift: [-cx/2-pcb_edge_pad, -cy/2-pcb_edge_pad]
        - ref: thumb_c4_r0
          shift: [-cx/2-pcb_edge_pad, -cy/2-pcb_edge_pad]
        - ref: thumb_c5_r0
          shift: [-cx/2-pcb_edge_pad, -cy/2-pcb_edge_pad]
        - ref: thumb_c5_r0
          shift: [cx/2+pcb_edge_pad, -cy/2-pcb_edge_pad]
        - ref: thumb_c5_r0
          shift: [cx/2+pcb_edge_pad, cy/2+pcb_edge_pad]
        - ref: mcu # East edge of the MCU column
          shift: [shroud_e_off, shroud_n_off]
        - ref: mcu # ...step back down to the key field
          shift: [shroud_w_off, shroud_n_off]
        - ref: matrix_c5_r4
          shift: [cx/2+pcb_edge_pad/2, pcb_north_off]
        - ref: matrix_c5_r4
          shift: [-cx/2, pcb_north_off]
        - ref: matrix_c2_r1
          shift: [-cx/2, -cy/2]

  # ----------------------------------------------------- PCB previews
  _pcb_keycaps:
    - where: [key]
      what: rectangle
      size: [keycap_w, keycap_d]
      fillet: keycap_fillet
    - where: [thumb]
      what: rectangle
      size: [keycap_w, keycap_d]
      fillet: keycap_fillet

  _pcb_mcu:
    - where: [mcu]
      what: rectangle
      size: [mcu_w, mcu_h]
    - where: [mcu]
      what: rectangle
      size: [mcu_usb_w, mcu_usb_d]
      operation: stack
      adjust.shift: [0, mcu_h/2 - mcu_usb_d/2 + mcu_usb_inset]

  _pcb_bat:
    - where: [bat]
      what: rectangle
      size: [bat_w, bat_l]
    - where: [bat_conn]
      what: rectangle
      size: [bat_conn_lane_w, bat_conn_l]
      operation: stack
      adjust.shift: [0, bat_conn_front - bat_conn_l/2]

  _pcb_screws:
    - where: [screw]
      what: circle
      radius: pcb_screw_hole_size/2

  _pcb_switches:
    - where: [reset_switch]
      what: rectangle
      size: [sw_reset_body_w, sw_reset_body_d]
      adjust.shift: [0, sw_reset_body_dy]
    - where: [on_off_switch]
      what: rectangle
      size: [sw_power_body_w, sw_power_body_d]
      adjust.shift: [sw_power_body_dx, 0]

  preview_pcb: # PCB preview stack for sanity checks.
    - what: outline
      name: ezy54
    - what: outline
      name: _pcb_keycaps
      operation: stack
    - what: outline
      name: _pcb_mcu
      operation: stack
    - what: outline
      name: _pcb_bat
      operation: stack
    - what: outline
      name: _pcb_screws
      operation: stack
    - what: outline
      name: _pcb_switches
      operation: stack

  # -------------------------------------------------------- switchplate
  _case_plate: # Switchplate: solid apart from the switch and screw holes.
    - what: outline
      name: ezy54
    - where: [key]
      what: rectangle
      size: case_switch_hole
      operation: subtract
    - where: [thumb]
      what: rectangle
      size: case_switch_hole
      operation: subtract
    - where: [screw]
      what: circle
      radius: case_plate_screw_r
      operation: subtract

  # Screw heads are let into whatever they land on: the plate for the
  # five field screws, the housing roof for the two boss screws. The
  # counterbore is cut full depth and its floor re-added as a ring, so
  # the clearance hole below it stays open.
  _plate_screw_cbore:
    - where: [plate_screw]
      what: circle
      radius: screw_head_r

  _plate_screw_cbore_floor:
    - what: outline
      name: _plate_screw_cbore
    - where: [plate_screw]
      what: circle
      radius: case_plate_screw_r
      operation: subtract

  _boss_screw_cbore:
    - where: [boss_screw]
      what: circle
      radius: screw_head_r

  _boss_screw_cbore_floor:
    - what: outline
      name: _boss_screw_cbore
    - where: [boss_screw]
      what: circle
      radius: case_plate_screw_r
      operation: subtract

  # ------------------------------------------------------- bottom case
  _case_bottom:
    - what: outline
      name: ezy54
      expand: case_wall_expand
      joints: pointy

  _case_pcb_mask:
    - what: outline
      name: ezy54
      expand: case_pcb_fit
      joints: pointy

  _case_wall:
    - what: outline
      name: _case_bottom
    - what: outline
      name: _case_pcb_mask
      operation: subtract

  _case_wall_io_mask: # Openings that keep a retaining lip below them
    - what: rectangle # Reset switch
      where: [matrix_c5_r4]
      size: [sw_reset_slot_w, case_io_mask_d]
      adjust.shift:
        - sw_reset_x_off + sw_reset_slot_dx
        - pcb_north_off - case_io_mask_overlap + case_io_mask_d/2
    - what: rectangle # USB-C, in the wall in front of the housing
      where: [mcu]
      size: [usb_win_w, case_io_mask_d]
      adjust.shift: [0, shroud_n_off - case_io_mask_overlap + case_io_mask_d/2]

  _case_wall_power_sw_mask: # Full height - needs finger access, and runs
    # west until it meets the reset opening so no post is left between them.
    - what: rectangle
      where: [matrix_c5_r4]
      size: [sw_power_slot_w, case_io_mask_d]
      adjust.shift:
        - sw_power_slot_x
        - pcb_north_off - case_io_mask_overlap + case_io_mask_d/2

  # Trim the masks to the wall before they are used, so they can never
  # bite into the floor - that is what left holes in the case bottom.
  _case_io_openings:
    - what: outline
      name: _case_wall
    - what: outline
      name: _case_wall_io_mask
      operation: intersect

  _case_power_opening:
    - what: outline
      name: _case_wall
    - what: outline
      name: _case_wall_power_sw_mask
      operation: intersect

  # Built from the same chain as _case_wall rather than by subtracting
  # _case_io_openings: makerjs will not reliably use the result of one
  # boolean as the operand of another, and the plain mask rectangles
  # cut cleanly. Because only the wall ring is ever cut, the floor
  # underneath stays intact.
  _case_wall_open:
    - what: outline
      name: _case_bottom
    - what: outline
      name: _case_pcb_mask
      operation: subtract
    - what: outline
      name: _case_wall_io_mask
      operation: subtract
    - what: outline
      name: _case_wall_power_sw_mask
      operation: subtract

  _case_screw_holes:
    - what: circle
      where: [screw]
      radius: case_insert_bore_r

  _case_screw_standoffs:
    - what: circle
      where: [screw]
      radius: case_standoff_r
    - what: outline
      name: _case_screw_holes
      operation: subtract

  preview_case: # Case preview stack for print fit.
    - what: outline
      name: _case_plate
    - what: outline
      name: _shroud_outer
      operation: stack
    - what: outline
      name: _shroud_inner
      operation: stack
    - what: outline
      name: _shroud_bosses
      operation: stack
    - what: outline
      name: _shroud_usb_window
      operation: stack
    - what: outline
      name: _case_wall_open
      operation: stack
    - what: outline
      name: _case_io_openings
      operation: stack
    - what: outline
      name: _case_screw_standoffs
      operation: stack
    - what: outline
      name: _pcb_keycaps
      operation: stack

  # --------------------------------------------------------- carry case
  _carry_case_mask:
    - what: outline
      name: ezy54
      expand: case_wall_expand + carry_fit

  _carry_case_inset_mask:
    - what: outline
      name: ezy54
      expand: case_wall_expand + carry_fit - carry_lip_w

  _carry_case_frame:
    - what: outline
      name: _case_bottom
      expand: carry_fit + carry_wall_t
    - what: outline
      name: _carry_case_mask
      operation: subtract

  _carry_case_inset_frame:
    - what: outline
      name: _case_bottom
      expand: carry_fit + carry_wall_t
    - what: outline
      name: _carry_case_inset_mask
      operation: subtract

  preview_carry_case: # Carry case preview stack.
    - what: outline
      name: _carry_case_inset_frame
    - what: outline
      name: _case_wall
      operation: stack

pcbs:
  ezy54:
    template: kicad8
    outlines:
      main:
        outline: ezy54
    footprints:
      keyswitches:
        where: [key]
        what: ceoloide/switch_choc_v1_v2
        params:
          from: "{{colrow}}"
          to: "{{col.name}}"
          hotswap: true
          choc_v1_support: true
          include_stabilizer_pad: false

          include_plated_holes: true
          include_centerhole_net: true

          hotswap_pads_same_side: false
          locked_traces_vias: true # Not movable
          outer_pad_width_front: pcb_switch_pad_w
          outer_pad_width_back: pcb_switch_pad_w

          reversible: true
        adjust.rotate: 180

      diodes:
        where: /key/
        what: ceoloide/diode_tht_sod123
        params:
          from: "{{colrow}}"
          to: "{{row}}"
          reversible: true
          include_traces_vias: true
        adjust.shift: [pcb_diode_x_off, pcb_diode_y_off]
        adjust.rotate: 180

      mcu:
        what: ceoloide/mcu_supermini_nrf52840
        where: mcu
        params:
          reversible: true
          only_required_jumpers: true
          P10: "r0"
          P3: "r1"
          P4: "r2"
          P5: "r3"
          P2: "r4"
          P15: "c0"
          P18: "c1"
          P16: "c2"
          P8: "c3"
          P9: "c4"
          P19: "c5"
          P6: "DA"
          P7: "CL"
          P14: "CS"
          P20_label: " "
          P21_label: " "
          use_rectangular_jumpers: false

      battery_connector:
        what: ceoloide/battery_connector_jst_ph_2
        where: bat_conn
        params:
          reversible: true

      on_off_switch:
        what: ceoloide/power_switch_smd_side
        where: on_off_switch
        params:
          from: BAT_P
          to: RAW
          reversible: true

      reset_switch:
        what: ceoloide/reset_switch_smd_side
        where: reset_switch
        params:
          reversible: true
          include_bosses: true
          include_silkscreen: true
          include_courtyard: true

      gnd_pour: # Both layers. The polygon is absolute, so `where` is moot.
        what: ceoloide/utility_filled_zone
        where: mcu
        params:
          side: "F&B"
          name: GND
          net: GND
          # KiCad coordinates, and literal: ergogen does not resolve unit
          # names inside nested arrays. Only has to enclose the board.
          points: [[135, 69], [285, 69], [285, 201], [135, 201]]

      mcu_pour_keepout: # Keep the pour out from under the module
        what: ceoloide/utility_keepout_zone
        where: mcu
        params:
          side: "F&B"
          name: MCU
          copperpour_allowed: false
          tracks_allowed: true
          vias_allowed: true
          pads_allowed: true
          # KiCad coordinates, literal - see above. Covers the MCU
          # footprint (253.03..271.95 x 83.79..117.39) plus ~0.5mm.
          points: [[252.5, 83.3], [272.5, 83.3], [272.5, 117.9], [252.5, 117.9]]

      screws:
        what: ceoloide/mounting_hole_npth
        where: /screw/
        params:
          hole_size: pcb_screw_hole_size
          hole_drill: pcb_screw_drill

cases:
  # Switchplate + the MCU/battery housing in one printed part.
  # Print plate-side down: only the housing cavity needs support.
  ezy54_case_switchplate_right:
    - what: outline
      name: _case_plate
      extrude: case_switchplate_d
    # Field screw heads, let into the plate
    - what: outline
      name: _plate_screw_cbore
      extrude: case_switchplate_d
      operation: subtract
    - what: outline
      name: _plate_screw_cbore_floor
      extrude: case_switchplate_d - screw_head_h
      operation: add
    # Housing, solid...
    - what: outline
      name: _shroud_outer
      extrude: case_shroud_h
    # ...hollowed out from the PCB side up...
    - what: outline
      name: _shroud_inner
      extrude: case_shroud_inner_h
      operation: subtract
    # ...with a window in the north wall at exactly the port's height
    - what: outline
      name: _shroud_usb_window
      extrude: usb_win_z1
      operation: subtract
    - what: outline
      name: _shroud_usb_sill
      extrude: usb_win_z0
      operation: add
    # Support cylinders inside the cavity, and their screw heads
    - what: outline
      name: _shroud_bosses
      extrude: case_shroud_h
      operation: add
    - what: outline
      name: _boss_screw_cbore
      extrude: case_shroud_h
      operation: subtract
    - what: outline
      name: _boss_screw_cbore_floor
      extrude: case_shroud_h - screw_head_h
      operation: add

  ezy54_case_left:
    - what: outline
      name: _case_bottom
      extrude: case_bottom_t
    - what: outline
      name: _case_screw_holes
      extrude: case_bottom_t
      operation: subtract
    - what: outline
      name: _case_screw_holes
      extrude: case_insert_lip_h
      operation: add
    - what: outline
      name: _case_screw_standoffs
      extrude: case_bottom_t + case_wall_rise # For 3mm deep inserts
    # The wall already has its openings cut, so nothing here can reach
    # the floor.
    - what: outline
      name: _case_wall_open
      extrude: case_h
    # Retaining lip under the reset and USB-C openings
    - what: outline
      name: _case_io_openings
      extrude: case_io_lip_h

  ezy54_carry_case:
    - what: outline
      name: _carry_case_inset_frame
      extrude: carry_h - carry_pocket_d
    - what: outline
      name: _carry_case_inset_frame
      extrude: carry_pocket_d
      operation: subtract
    - what: outline
      name: _carry_case_frame
      extrude: carry_h
